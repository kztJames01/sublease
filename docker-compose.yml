version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Avoid overriding node_modules
    environment:
      - NODE_ENV=development  # Use 'production' for prod
    command: npm run dev  # Overrides CMD for development
    depends_on:
      - backend

  backend:
    build:
      context: ./puddle
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./puddle:/app
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/sublease_db
      - DJANGO_SETTINGS_MODULE=puddle.settings  # Adjust to your settings module
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=sublease_db
    ports:
      - "5432:5432"
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
volumes:
  postgres_data: